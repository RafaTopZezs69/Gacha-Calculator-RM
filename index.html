.f label{font-size:12px;color:var(--tx)}

.q{display:flex;gap:6px;justify-content:flex-end}
.q button{background:var(--in);color:var(--tx);border:1px solid var(--line);font:inherit;font-size:10px;font-weight:700;padding:4px 8px;cursor:pointer}
.q button:hover{border-color:var(--ac)}
.r{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline;padding:2px 0}
.r span{font-size:12px}.r b{font-size:19px;text-align:right;font-variant-numeric:tabular-nums}
.r em{font-style:normal;font-size:10px;color:var(--mut);grid-column:2;text-align:right;margin-top:-4px}
.r.p b{color:var(--ac2)}
hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.go{margin-top:auto;background:var(--btn);color:var(--btnx);border:0;padding:12px;font:inherit;font-weight:700;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.g{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:8px 8px;align-items:baseline;font-size:12.5px}
.g .h{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;text-align:right}
.g b{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.d{font-size:12px;color:var(--mut)}
section.oth{margin-top:12px}
.dw{position:relative}
.dv{display:block;position:relative;background:var(--in);color:var(--tx);border:1px solid var(--line);padding:8px;text-align:center}
.dv::after{content:"▾";position:absolute;right:8px;color:var(--mut)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:50}

.cdt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
